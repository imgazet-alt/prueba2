function calcProteccion(history, days = 7) {
  if (!history.length) return {
    pct: 0,
    nivel: "Sin datos",
    color: C.dim,
    riesgo: 85
  };
  const cut = new Date();
  cut.setDate(cut.getDate() - days);
  const rec = history.filter(h => new Date(h.fechaISO) >= cut);
  const pts = rec.reduce((a, b) => a + (b.pts || 0), 0);
  const rawPct = Math.min(100, Math.round(pts / (days * 60) * 100));
  const painDays = rec.filter(h => (h.evaMax || 0) >= 6).length;
  const pct = Math.max(0, rawPct - painDays * 5);
  const nivel = pct >= 85 ? "EXCELENTE" : pct >= 70 ? "BUENA" : pct >= 50 ? "MODERADA" : pct >= 30 ? "BAJA" : "CRÍTICA";
  const color = pct >= 85 ? C.accent : pct >= 70 ? C.teal : pct >= 50 ? C.yellow : pct >= 30 ? C.orange : C.red;
  const riesgo = Math.max(5, 90 - pct);
  return {
    pct,
    nivel,
    color,
    riesgo
  };
}
function calcRiesgo(history) {
  if (!history.length) return {
    pct: 75,
    nivel: "Alto",
    color: C.orange
  };
  const cut = new Date();
  cut.setDate(cut.getDate() - 7);
  const l7 = history.filter(h => new Date(h.fechaISO) >= cut);
  const adh = Math.min(1, l7.length / 5);
  const avgEva = l7.length ? l7.reduce((a, b) => a + (b.evaMax || 0), 0) / l7.length : 5;
  const riesgo = Math.max(5, Math.min(95, 70 - adh * 40 + avgEva * 2));
  const nivel = riesgo < 20 ? "Muy bajo" : riesgo < 35 ? "Bajo" : riesgo < 55 ? "Moderado" : riesgo < 70 ? "Alto" : "Muy alto";
  const color = riesgo < 20 ? C.accent : riesgo < 35 ? C.teal : riesgo < 55 ? C.yellow : riesgo < 70 ? C.orange : C.red;
  return {
    pct: Math.round(riesgo),
    nivel,
    color
  };
}

// Queue multiple speech utterances without cancelling each other
function speakQueue(texts, settings = {}) {
  if (!settings.voz) return;
  try {

      setTimeout(() => {
        try {

          u.lang = "es-MX";
          u.rate = settings.vozVelocidad || 0.88;
          u.pitch = settings.vozTono || 1.0;
          u.volume = settings.volumen || 1;

        } catch (e) {}

  // pattern: [{phase:'inhala',secs:4},{phase:'sostén',secs:2},{phase:'exhala',secs:6}]
  let stopped = false;
  let timeouts = [];
  const loop = () => {
    if (stopped) return;
    let offset = 0;
    pattern.forEach(p => {
      const t = setTimeout(() => {

      timeouts.push(t);
      offset += p.secs;
    });
    const loopT = setTimeout(loop, offset * 1000);
    timeouts.push(loopT);
  };
  loop();
  return () => {
    stopped = true;
    timeouts.forEach(clearTimeout);
  };
